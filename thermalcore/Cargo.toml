[package]
name = "rianixia-thermalcore"
version = "2.0.0"
edition = "2024"
authors = ["rianixia"]

[dependencies]
nix = { version = "0.30", features = ["poll", "time"] }
inotify = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0.1", features = ["serde"] }
signal-hook = "0.3"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37.2"
serde_json = "1.0"

# قرار المالك (تكملة ٨٦): زمن البناء مُقدَّم على آخر نسبة من الأداء.
#
# `lto = true` + `codegen-units = 1` أبطأ إعداد ممكن لمُصرّف Rust: ربطٌ كامل (fat LTO) على وحدة
# ترجمة واحدة يعني إعادة تحليل الشجرة كلها في كل عملية ربط — **وهي غير تزايدية بطبيعتها**، فكل
# بناء إصدار يعيد الربط كاملًا مهما كان التغيير حرفًا. و`thin` يُبقي معظم مكسب التصغير بأجزاء
# صغيرة من كلفته، و`16` وحدة تُخفّف انتظار المُصرّف. والفرق في الأداء أجزاء بالمئة في خدمة
# تعمل في الخلفية — والمقابل دقائق في كل بناء.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[features]
simulator = []

[[bin]]
name = "rianixia-thermalcore"
path = "src/main.rs"

