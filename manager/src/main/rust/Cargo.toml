[package]
name = "maxmanager_native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# التبعيات المستخدمة فعليًا فقط — أزيلت tokio (لا async هنا)،
# rand (الوكيل حتمي بالكامل)، rustfft/num-complex (تحليل FFT الميت)،
# و ndarray-rand (كانت لمسار LSTM المحذوف). serde صارت مستخدمة
# فعلًا لاستمرارية نموذج الوكيل.
jni = "0.21.1"
ndarray = "0.15"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# ضغط zip (ADR-49): المُحرّك zlib-rs عمدًا لا miniz_oxide — لأنه **وحده** يتقدّم على zlib
# الأصلية عند JDK. والقياس على شجرتين حقيقيتين (٥.٣ميجا نصّة و٣٧.١ميجا موارد):
#   المستوى ٦: JDK 211ms · miniz_oxide 217ms (=0.97×، أي أبطأ) · zlib-rs 107ms (1.97×).
# فبغير هذا السطر لا معنى للنقل: نقلٌ يُبطئ. وثمن الحجم مقيس ومعلن: +367KB في المكتبة الأصلية.
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[features]
default = []

# قرار المالك (تكملة ٨٦): `thin` + `16` مكان fat LTO ووحدة ترجمة واحدة.
#
# وهذه المكتبة هي الوحيدة من الأربعة **التي تُحمَّل داخل عملية التطبيق** (وكيل التعلم المعزز،
# المتنبئ، التوأم الرقمي، محرك السياق)، فثمن المقايضة هنا أظهر ما يكون: `codegen-units = 16`
# يقلّل ما يراه المُحسِّن من الشجرة في الوحدة الواحدة. وثمنه المقيس في مثل هذه الأعباء أجزاء
# بالمئة، ومقابله أنه يقع **في المسار الحرج** قبل Gradle (الـAPK يحتاجه) فيقصّ من زمن كل بناء.
# وإن ظهر يومًا أن استدلال المحرك أبطأ ممّا كان، فأوّل ما يُعاد إلى ما كان هو هذا السطران.
[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 16