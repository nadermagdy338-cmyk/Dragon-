[versions]
# Engine dari KernelSU (Bleeding Edge)
agp = "9.2.0"
kotlin = "2.3.10"
ksp = "2.3.10"
hiddenapibypass = "6.1"
# Compose 1.9 stable line. The old blocker — the 1.12.0-alpha03 chain demanding
# compileSdk 37 — is gone as of تكملة ١١٠ (`platforms;android-37.0` is published and
# pinned in CI). A bump is therefore *possible* now, but it stays pinned here on
# purpose: moving the whole Compose/Material line is its own measured round, not a
# side effect of the SDK bump.
compose-bom = "2025.10.01"
kotlinxSerialization = "1.11.0"
library = "1.2.1"
junit = "4.13.2"
junitVersion = "1.3.0"
composeMarkdown = "0.7.2"
hilt = "2.60.1"

# UI & Library
# كان سقف SDK-36 يمنع 1.5.0-alpha23 / 2.11.0-beta02 (تطلب compileSdk 37 غير المنشور).
# **والسقف زال (تكملة ١١٠):** `android-37.0` منشور و`:app` عليه الآن — فيصير الارتفاع
# ممكنًا، لكنه يبقى جولة قياس مستقلة لا أثرًا جانبيًّا لتغيير الـSDK.
#
# و`1.4.0` **المستقر** حلّ محل `1.4.0-alpha15`: الخط نفسه (١.٤) لكن بلا لاحقة إصدار
# تجريبي، وهو ما كان يُشتكى منه ضمنيًّا (شحن alpha في مسار الإنتاج).
material3 = "1.4.0"
activity-compose = "1.11.0"
lifecycle = "2.9.4"
# **مقيس في تكملة ٤٠، لا منقولًا من ذاكرة:** `2.10.1` **ترفض** البناء بـ
# `checkReleaseAarMetadata`، ومعها ثلاثة اعتماديات منقولة:
#   navigation-compose-android:2.10.1 · lifecycle-runtime-compose-android:2.11.0 ·
#   lifecycle-viewmodel-compose-android:2.11.0 ⇒ «requires … compileSdk 37» وكان `:app` على android-36.
# **والمانع زال في تكملة ١١٠** (`:app` على android-37.0) ⇒ الإصدارات الأحدث صارت
# قابلة للتجربة، والثابت هنا مقصود حتى جولة ترقية مقيسة.
navigation = "2.9.4"

# Security & Glassmorphism
stringfog = "5.1.0"
stringfogXor = "5.0.0"
haze = "2.0.0-alpha02"  # builds against compose 1.9; monitor for SDK-37 metadata

# Media
coil = "2.7.0"
media3 = "1.3.0"
appiconloader-coil = "1.5.0"
ucrop = "2.2.11-native"

# Tools & Core
appcompat = "1.8.0"
androidx-transition = "1.7.1"
lifecycleViewModel = "2.9.4"
libsu = "6.0.0"
# Shizuku: طبقة امتياز ثانية بمستوى ADB بلا جذر (AR-20).
# api = واجهة الاستدعاء، provider = ContentProvider يحمل خدمة الصلاحية في البيان.
shizuku = "13.1.5"
documentfile = "1.1.0"
material = "1.14.0"
coreSplashscreen = "1.2.0"

[libraries]
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
compose-markdown = { group = "com.github.jeziellago", name = "compose-markdown", version.ref = "composeMarkdown" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }
ansi-library = { module = "com.github.Fox2Code.AndroidANSI:library", version.ref = "library" }
ansi-library-ktx = { module = "com.github.Fox2Code.AndroidANSI:library-ktx", version.ref = "library" }
androidx-transition = { group = "androidx.transition", name = "transition", version.ref = "androidx-transition" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }

# Core Android & Lifecycle
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModel" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Compose BOM & UI
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material = { group = "androidx.compose.material", name = "material" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
material-kolor = { group = "com.materialkolor", name = "material-kolor", version = "5.0.0-alpha07" }

# Image & Media
io-coil-kt-coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coil" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
me-zhanghai-android-appiconloader-coil = { group = "me.zhanghai.android.appiconloader", name = "appiconloader-coil", version.ref = "appiconloader-coil" }
yalantis-ucrop = { group = "com.github.yalantis", name = "ucrop", version.ref = "ucrop" }

# StringFog (Security)
stringfog-xor = { group = "com.github.megatronking.stringfog", name = "xor", version.ref = "stringfogXor" }

# Haze (Glassmorphism)
haze = { module = "dev.chrisbanes.haze:haze-android", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
haze-materials = { module = "dev.chrisbanes.haze:haze-blur-materials", version.ref = "haze" }

androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# Libsu 
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

com-github-topjohnwu-libsu-core = { group = "com.github.topjohnwu.libsu", name = "core", version.ref = "libsu" }
com-github-topjohnwu-libsu-service = { group = "com.github.topjohnwu.libsu", name = "service", version.ref = "libsu" }
com-github-topjohnwu-libsu-io = { group = "com.github.topjohnwu.libsu", name = "io", version.ref = "libsu" }

# Serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
stringfog = { id = "stringfog", version.ref = "stringfog" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.3.10" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
