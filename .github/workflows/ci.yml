name: MaxManager CI (KernelSU Module + AOSP Bundle)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-native:
    name: Build Rust (Android NDK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: false

      - name: Build Rust for Android
        run: |
          cd manager/src/main/rust
          cargo ndk -t armeabi-v7a -t arm64-v8a -o ../../../app/src/main/jniLibs build --release

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: manager/app/src/main/jniLibs/

  build-aosp-bundle:
    name: Build AOSP ROM Bundle
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: manager/app/src/main/jniLibs/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # API 37 is not published on the GitHub-hosted SDK repository yet.
          # Use the latest stable platform/build-tools pair available there.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission to gradlew
        run: chmod +x manager/gradlew

      - name: Build APK (embedded in ROM)
        run: |
          cd manager
          ./gradlew :app:assembleDebug --no-daemon

      # TODO: this step is currently broken and disabled — see note below.
      # - name: Build Rust Daemon
      #   run: |
      #     cd manager/src/main/rust
      #     cargo build --release --target aarch64-linux-android
      #     mkdir -p ../../../../android/aosp/system/bin
      #     cp target/aarch64-linux-android/release/maxmanager_daemon ../../../../android/aosp/system/bin/maxmanager_daemon
      #
      # NOTE (disabled, needs a decision from a maintainer):
      # `manager/src/main/rust` (crate `maxmanager_native`) only declares
      # `crate-type = ["cdylib"]` with no `[[bin]]` target or main.rs, so
      # `cargo build` here can never produce an executable named
      # `maxmanager_daemon` — this step always fails.
      # `android/aosp/Android.bp` expects the daemon source at
      # `runtime/daemon-rust/src/**/*.rs`, which does not exist in this repo.
      # Until that source is added (or this step is pointed at the real
      # daemon, e.g. the C daemon built by archdaemon/ as
      # `sys.maxmanager-service`), leave this disabled instead of failing
      # the AOSP bundle job.

      - name: Create AOSP bundle structure
        run: |
          mkdir -p aosp-bundle/system/app/MaxManager
          mkdir -p aosp-bundle/system/bin
          mkdir -p aosp-bundle/system/lib64
          mkdir -p aosp-bundle/system/etc/init
          mkdir -p aosp-bundle/vendor/etc/selinux
          mkdir -p aosp-bundle/device

          cp manager/app/build/outputs/apk/debug/app-debug.apk aosp-bundle/system/app/MaxManager/MaxManager.apk
          cp manager/app/src/main/jniLibs/arm64-v8a/libmaxmanager_native.so aosp-bundle/system/lib64/
          cp android/aosp/maxmanager.rc aosp-bundle/system/etc/init/
          cp android/aosp/sepolicy/* aosp-bundle/vendor/etc/selinux/
          cp android/aosp/BoardConfig.mk aosp-bundle/device/

      - name: Package AOSP bundle
        run: |
          cd aosp-bundle
          zip -r ../MaxManager-aosp-bundle.zip *

      - name: Upload AOSP bundle
        uses: actions/upload-artifact@v4
        with:
          name: MaxManager-aosp-bundle
          path: MaxManager-aosp-bundle.zip

  build-kernelsu-module:
    name: Build KernelSU Module
    runs-on: ubuntu-latest
    needs: build-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          name: native-libs
          path: manager/app/src/main/jniLibs/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Grant execute permission to gradlew
        run: chmod +x manager/gradlew

      - name: Build APK (embedded in KernelSU module)
        run: |
          cd manager
          ./gradlew :app:assembleDebug --no-daemon

      - name: Create KernelSU module structure
        run: |
          mkdir -p kernelsu-module/system/app/MaxManager
          mkdir -p kernelsu-module/system/lib64
          mkdir -p kernelsu-module/bin

          cp manager/app/build/outputs/apk/debug/app-debug.apk kernelsu-module/system/app/MaxManager/MaxManager.apk
          cp manager/app/src/main/jniLibs/arm64-v8a/libmaxmanager_native.so kernelsu-module/system/lib64/
          cp android/kernelsu/* kernelsu-module/ 2>/dev/null || true

      - name: Package KernelSU module
        run: |
          cd kernelsu-module
          zip -r ../MaxManager-kernelsu-module.zip *

      - name: Upload KernelSU module
        uses: actions/upload-artifact@v4
        with:
          name: MaxManager-kernelsu-module
          path: MaxManager-kernelsu-module.zip
