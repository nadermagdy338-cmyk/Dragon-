[package]
name = "maxmanager-utilityconf"
version = "1.0.0"
edition = "2024"
description = "MaxManager Utility binaries"

[dependencies]
glob = "0.3.1"

# قرار المالك (تكملة ٨٦): `thin` + `16` مكان fat LTO ووحدة ترجمة واحدة — نفس السبب المشروح
# في `thermalcore/Cargo.toml`: الربط الكامل غير تزايدي فيُعاد كاملًا كل بناء.
[profile.release]
opt-level = 'z'
lto = "thin"
codegen-units = 16
panic = 'abort'
strip = true